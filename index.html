 nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:14px;padding:12px 14px;border-radius:14px;font-size:16px;color:var(--mute)}
 nav button.on{background:rgba(255,255,255,.08);color:var(--amber)}
 #toast{bottom:calc(var(--pbh) + 20px)}
 .recent,.recent.r3{grid-template-columns:repeat(3,1fr);grid-template-rows:1fr;height:210px}
 .recent .tile:first-child{grid-row:auto}
 .recent.r2{grid-template-columns:repeat(2,1fr);height:170px}
 .recent.r1{grid-template-columns:minmax(0,420px);height:170px}
 .dc{width:140px;height:140px}
 #mini{--cream:#f3ede0;--mute:#a39c90;--card:rgba(255,255,255,.1);--line:rgba(255,255,255,.14);--bg:#0f0e0d;left:0;right:0;bottom:0;height:var(--pbh);border-radius:0;border:0;border-top:1px solid rgba(255,255,255,.08);background:#0f0e0d;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0 24px;cursor:default}
 #mini:not([hidden]){display:grid;grid-template-columns:minmax(200px,1fr) minmax(320px,1.5fr) minmax(220px,1fr);align-items:center;gap:20px}
 #mini .mr{cursor:pointer}#mini .mr #mP,#mini .bar{display:none}
 #mini .dk{display:flex;flex-direction:column;gap:6px}
 #mini .dr{display:flex;justify-content:flex-end;align-items:center;gap:4px}
 .dcn{display:flex;justify-content:center;align-items:center;gap:14px}
 .dcn .tb{background:none;border:0;cursor:pointer;padding:6px}.dcn .tb svg{width:26px;height:26px;fill:var(--cream)}
 .dcn .pb{width:46px;height:46px;box-shadow:none}.dcn .pb svg{width:20px;height:20px;fill:var(--bg)}
 .dcn .ic,#mini .dr .ic{background:none;width:auto;height:auto;border-radius:0;display:block;padding:8px}
 .ds{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute)}
 .ds input,.vol input{margin:0;padding:0;border:0;background:none;accent-color:rgb(var(--acc));height:auto}
 .ds input{flex:1}
 .vol{display:flex;align-items:center;gap:6px;margin:0 8px;color:var(--mute)}
 .vol svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
 .vol input{width:96px}
}
#hd{overflow:hidden}#hd>img{position:relative;z-index:1;filter:drop-shadow(0 1px 6px rgba(0,0,0,.35))}#hd .sc{background:linear-gradient(rgba(0,0,0,.22),rgba(0,0,0,.45))}
@media (max-width:859px){#hd{height:calc(var(--hd) + 36px);padding-bottom:36px}#hd .bl{inset:0;filter:none}#hd .sc{background:linear-gradient(rgba(0,0,0,.16),rgba(0,0,0,.4))}}
#full{padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
.artw{width:min(100%,36vh);width:min(100%,36dvh)}
#full>#lyPeek{position:absolute;left:12px;right:12px;bottom:0;height:calc(58px + env(safe-area-inset-bottom,0px));padding:10px 18px env(safe-area-inset-bottom,0px);border-radius:26px 26px 0 0;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);border-bottom:0;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 -8px 28px rgba(0,0,0,.18);cursor:pointer;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;z-index:3}
#lyPeek .grab{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.55)}
#lyPeek .pk{display:flex;flex-direction:column;align-items:center;max-width:100%}
#lyPeek span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
#lyPeek b{font-weight:500;font-size:14px;color:var(--cream);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-height:760px){.artw{width:min(100%,30vh);width:min(100%,30dvh)}.ctl{margin-top:10px;padding:6px 12px}.ex{margin-top:10px}}
.artw{width:min(100%,max(200px,calc(100vh - 500px)));width:min(100%,max(200px,calc(100dvh - 500px)))}
#big{border-radius:32px}
/* Now Playing sizing: art takes whatever height is left, everything else keeps its room */
.artw{width:100%;flex:1 1 0;min-height:0;margin:6px 0 18px;container-type:size;display:grid;place-items:center;align-self:stretch}
.artb{position:relative;width:min(100cqw,100cqh);height:min(100cqw,100cqh)}
@supports not (width:1cqw){.artb{width:min(100%,38vh);height:auto;aspect-ratio:1}}
#big{width:100%;height:100%;border-radius:32px;box-shadow:0 18px 44px rgba(0,0,0,.35)}
#amb{inset:0;border-radius:32px;background:none;filter:none;box-shadow:0 0 60px 18px rgba(var(--acc),.55),0 18px 110px 30px rgba(var(--acc),.28);opacity:calc(.5*var(--ak,1))}
@keyframes breathe{0%,100%{opacity:calc(.4*var(--ak,1));transform:scale(1)}50%{opacity:calc(.75*var(--ak,1));transform:scale(1.035)}}
#full{padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
#full>#lyPeek{left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom,0px));height:54px;padding:8px 16px;border-radius:22px;border:1px solid rgba(255,255,255,.22)}
@media (min-aspect-ratio:11/10),(min-width:860px){#lyPeek,#full .fl{display:none!important}#full{padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}}
@media (min-width:860px){
 #full .ex #lyBtn,#full .ex #snd,#fQ{display:none}
 #hd .bl{inset:0;filter:none}
 #hd .sc{background:linear-gradient(rgba(0,0,0,.1),rgba(0,0,0,.28))}
 #hd img{box-sizing:content-box;height:34px;padding:8px 16px;background:rgba(10,10,11,.42);border-radius:16px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
 nav{top:100px;bottom:auto;height:auto;left:14px;width:calc(var(--sbw) - 28px);padding:8px;background:rgba(10,10,11,.45);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.14);border-radius:20px}
}
/* glow: song art, fading out softly */
#amb{inset:-16%;border-radius:36px;filter:none;box-shadow:none;-webkit-mask-image:radial-gradient(closest-side,#000 60%,transparent 100%);mask-image:radial-gradient(closest-side,#000 60%,transparent 100%);opacity:calc(.8*var(--ak,1))}
@keyframes breathe{0%,100%{opacity:calc(.6*var(--ak,1));transform:scale(1)}50%{opacity:calc(.95*var(--ak,1));transform:scale(1.04)}}
/* lyrics: one control only. The slide-up drawer is attached to the bottom edge again */
#full>#lyPeek{left:12px;right:12px;bottom:0;height:calc(76px + env(safe-area-inset-bottom,0px));padding:10px 18px 0;border-radius:26px 26px 0 0;border:1px solid rgba(255,255,255,.22);border-bottom:0;justify-content:flex-start}
#full{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
#full .ex #lyBtn{display:none}
@media (min-aspect-ratio:11/10) and (max-width:859px){#full .ex #lyBtn{display:inline-block}}
@media (min-aspect-ratio:11/10),(min-width:860px){#full{padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}}
/* the glow reaches past the cover and was sitting on top of the header buttons, swallowing taps */
#amb,.artw,.artb{pointer-events:none}
#big{pointer-events:auto}
#full>.fh{z-index:4}
#full .fh button{position:relative;z-index:1}
/* premium playback controls: no panel behind them */
.cd{position:relative}
.cmo{position:absolute;top:6px;right:6px;width:30px;height:30px;padding:0;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center}
.cmo svg{width:18px;height:18px}
.ctl{background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:4px 6px;margin-top:14px}
.ctl .ic{background:none;width:46px;height:46px;border-radius:50%;opacity:.72;transition:opacity .2s,transform .15s,color .2s}
.ctl .ic svg{width:25px;height:25px;stroke-width:1.5}
.ctl .ic.on{opacity:1;color:rgb(var(--acc))}
.ctl .ic.on::after{content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;border-radius:50%;background:rgb(var(--acc));transform:translateX(-50%)}
.ctl>button:not(.ic){width:54px;height:54px;border-radius:50%;display:grid;place-items:center;padding:0;transition:transform .15s,opacity .2s}
.ctl>button:not(.ic) svg{width:30px;height:30px;fill:#fff;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.ctl .pb{width:76px;height:76px;background:linear-gradient(160deg,#fff,rgba(255,255,255,.84));box-shadow:0 12px 32px rgba(var(--acc),.5),0 2px 6px rgba(0,0,0,.25),inset 0 1px 0 #fff;transition:transform .15s,box-shadow .25s}
.ctl .pb svg{width:30px;height:30px;fill:#14110f;filter:none}
.ctl button:active{transform:scale(.9)}
#mini .dcn .pb{background:linear-gradient(160deg,#fff,#e9e2d6);box-shadow:0 6px 18px rgba(var(--acc),.4)}
@media (min-width:860px){#hd{width:calc(var(--sbw) + 32px)}}
/* Spotify-style lyrics */
#lyr .sc{background:linear-gradient(rgba(0,0,0,.16),rgba(0,0,0,.34) 55%,rgba(0,0,0,.58))}
#lyr .lyi h2{font-family:Figtree,system-ui,sans-serif;font-weight:700;font-size:20px}
#lyL{padding:26vh 0 46vh;-webkit-mask-image:linear-gradient(transparent 0,#000 9%,#000 76%,transparent 100%);mask-image:linear-gradient(transparent 0,#000 9%,#000 76%,transparent 100%);scroll-behavior:auto}
#lyL p{font-family:Figtree,system-ui,sans-serif;font-weight:700;font-size:clamp(24px,6.6vw,32px);line-height:1.22;letter-spacing:-.012em;margin:0 0 22px;color:rgba(255,255,255,.4);opacity:1;transform:scale(.965);transform-origin:left center;transition:color .35s,transform .35s;cursor:pointer}
#lyL p.past{opacity:1;color:rgba(255,255,255,.34)}
#lyL p.on{color:#fff;transform:scale(1)}
#lyL p.none{font-size:18px;font-weight:600;transform:none;cursor:default;color:rgba(255,255,255,.85)}
#lyL p.note{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:rgba(255,255,255,.55);transform:none;cursor:default;margin-bottom:18px}
#lyL.static p{color:rgba(255,255,255,.95);font-size:clamp(20px,5.2vw,24px);font-weight:600;transform:none;cursor:default;margin-bottom:16px}
#lyL.static p.note{color:rgba(255,255,255,.55);font-size:13px}
#lyL p.gap{display:flex;gap:8px;align-items:center;height:36px;margin:0 0 18px;cursor:default;transform:none}
#lyL p.gap i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.4);transition:background .3s}
#lyL p.gap.on i{background:#fff;animation:lyDot 1.3s ease-in-out infinite}
#lyL p.gap.on i:nth-child(2){animation-delay:.18s}#lyL p.gap.on i:nth-child(3){animation-delay:.36s}
@keyframes lyDot{0%,100%{transform:translateY(0);opacity:.55}40%{transform:translateY(-6px);opacity:1}}
.lyb{padding-top:8px}
.lyb input{width:100%;margin:6px 0 2px;padding:0;border:0;background:none;accent-color:#fff;height:auto}
.lyc{display:flex;justify-content:center;align-items:center;gap:30px;margin-top:6px}
.lyc .tb{background:none;border:0;padding:8px;cursor:pointer}.lyc .tb svg{width:30px;height:30px;fill:#fff}
.lyc .pb{width:60px;height:60px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
@media (min-aspect-ratio:11/10),(min-width:860px){#lyr{grid-template-rows:minmax(0,1fr) auto}#lyr>.lyb{grid-column:1/-1;grid-row:2}}
@media (prefers-reduced-motion:reduce){#lyL p.gap.on i{animation:none}}

#splash em{position:absolute;left:0;right:0;bottom:calc(82px + env(safe-area-inset-bottom,0px));text-align:center;font:italic 400 17px/1 Georgia,"Times New Roman",serif;letter-spacing:.06em;color:rgba(255,255,255,.88);text-shadow:0 1px 12px rgba(0,0,0,.7)}
#splash.go{animation:splashOut .6s ease forwards}
#splash b{position:absolute;left:50%;bottom:calc(52px + env(safe-area-inset-bottom,0px));width:92px;height:2px;margin-left:-46px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}
#splash b i{display:block;width:40%;height:100%;background:rgba(255,255,255,.85);border-radius:2px;animation:splashBar 1.1s ease-in-out infinite}
@keyframes splashBar{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#splash b i{animation:none;width:100%}#splash.go{animation-duration:.01s}}
/* seek bars: filled track, per-style colours */
#app{--fill:rgb(var(--acc));--th:4px;--tw:14px;--psa:rgb(var(--acc))}
#app[data-ps=spotify]{--fill:#fff;--th:4px;--tw:12px;--psa:#1ed760}
#app[data-ps=apple]{--fill:#fff;--th:7px;--tw:0px;--psa:#fff}
#app[data-ps=ytm]{--fill:#ff3d3d;--th:3px;--tw:12px;--psa:#fff}
#seek,#dSeek,#lySeek{-webkit-appearance:none;appearance:none;background:transparent;height:22px;cursor:pointer;accent-color:var(--fill)}
#seek::-webkit-slider-runnable-track,#dSeek::-webkit-slider-runnable-track,#lySeek::-webkit-slider-runnable-track{height:var(--th);border-radius:6px;background:linear-gradient(var(--fill),var(--fill)) 0/var(--p,0%) 100% no-repeat,rgba(255,255,255,.28)}
#seek::-webkit-slider-thumb,#dSeek::-webkit-slider-thumb,#lySeek::-webkit-slider-thumb{-webkit-appearance:none;width:var(--tw);height:var(--tw);margin-top:calc((var(--th) - var(--tw))/2);border-radius:50%;background:var(--fill);box-shadow:0 1px 4px rgba(0,0,0,.4)}
#seek::-moz-range-track,#dSeek::-moz-range-track,#lySeek::-moz-range-track{height:var(--th);border-radius:6px;background:rgba(255,255,255,.28)}
#seek::-moz-range-progress,#dSeek::-moz-range-progress,#lySeek::-moz-range-progress{height:var(--th);border-radius:6px;background:var(--fill)}
#seek::-moz-range-thumb,#dSeek::-moz-range-thumb,#lySeek::-moz-range-thumb{width:var(--tw);height:var(--tw);border:0;border-radius:50%;background:var(--fill)}
.ctl .ic.on{color:var(--psa)}.ctl .ic.on::after{background:var(--psa)}
/* Spotify */
[data-ps=spotify] .ctl .pb,[data-ps=spotify] .lyc .pb{background:#fff;box-shadow:none;width:66px;height:66px}
[data-ps=spotify] .ctl .pb svg,[data-ps=spotify] .lyc .pb svg{fill:#000}
[data-ps=spotify] .ctl>button:not(.ic) svg{filter:none}
/* Apple Music */
[data-ps=apple] .ctl .pb{background:none;box-shadow:none;width:88px;height:88px}
[data-ps=apple] .ctl .pb svg{width:50px;height:50px;fill:#fff;filter:drop-shadow(0 2px 8px rgba(0,0,0,.25))}
[data-ps=apple] .ctl>button:not(.ic){width:64px;height:64px}
[data-ps=apple] .ctl>button:not(.ic) svg{width:40px;height:40px}
[data-ps=apple] .ctl .ic{border-radius:13px;background:rgba(255,255,255,.16);width:42px;height:42px;opacity:1}
[data-ps=apple] .ctl .ic.on{background:#fff;color:#14110f}[data-ps=apple] .ctl .ic.on::after{display:none}
[data-ps=apple] .lyc .pb,[data-ps=apple] .dcn .pb,[data-ps=apple] #mini .pb{background:none;box-shadow:none}
[data-ps=apple] .lyc .pb svg{fill:#fff;width:34px;height:34px}[data-ps=apple] .dcn .pb svg,[data-ps=apple] #mini .pb svg{fill:var(--cream)}
/* YouTube Music */
[data-ps=ytm] .ctl .pb{background:#fff;width:80px;height:80px;box-shadow:0 4px 14px rgba(0,0,0,.35)}[data-ps=ytm] .ctl .pb svg{fill:#000;width:34px;height:34px}
[data-ps=ytm] .ctl .ic.on{opacity:1;color:#fff;background:rgba(255,255,255,.18)}[data-ps=ytm] .ctl .ic.on::after{display:none}
/* gestures */
#full,#mini,#lyr{touch-action:none}#lyL{touch-action:pan-y}main{touch-action:pan-y}
.flash{position:absolute;inset:0;display:grid;place-items:center;font:700 30px Figtree,system-ui,sans-serif;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.55);pointer-events:none;z-index:3;animation:flashUp .65s ease forwards}
@keyframes flashUp{0%{opacity:0;transform:scale(.8)}25%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.08)}}
/* now playing indicator */
.li>i{position:relative}
.eq{display:none;position:absolute;inset:0;border-radius:inherit;background:rgba(0,0,0,.5);align-items:flex-end;justify-content:center;gap:3px;padding-bottom:30%;text-decoration:none}
.eq s{display:block;width:3px;height:12px;background:#fff;border-radius:2px;transform-origin:bottom;text-decoration:none;animation:eqb .9s ease-in-out infinite}
.eq s:nth-child(2){animation-delay:.2s}.eq s:nth-child(3){animation-delay:.4s}
.li.on .eq{display:flex}
.tile .eq{inset:auto;top:12px;right:12px;width:30px;height:28px;border-radius:9px;padding-bottom:6px;background:rgba(0,0,0,.55);z-index:2}.tile.on .eq{display:flex}
@keyframes eqb{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
#app[data-pl="0"] .eq s{animation-play-state:paused}
.cd.now b,.li.now b{color:var(--amber)}
.cd.now>i{box-shadow:0 0 0 2px var(--amber)}
@media (prefers-reduced-motion:reduce){.eq s{animation:none;transform:scaleY(.7)}}
#lyH .pb{width:48px;height:48px}.lyc{gap:72px}
[data-ps=apple] #lyH .pb{background:rgba(255,255,255,.18);box-shadow:none}[data-ps=apple] #lyH .pb svg{fill:#fff}
/* text visibility */
#app{--atx:#8a5c1f}#app[data-theme=dark]{--atx:#e0b074}
.li.on b,.cd.now b,.li.now b,nav button.on{color:var(--atx)}
#app[data-hc="1"]{--cream:#000;--mute:#3a352e;--line:#bdb7ac}
#app[data-theme=dark][data-hc="1"]{--cream:#fff;--mute:#d6cfc2;--line:#5a544b}
#app[data-hc="1"] .li small,#app[data-hc="1"] .cd small,#app[data-hc="1"] .empty,#app[data-hc="1"] .top{font-weight:500}
#full,#lyr{--mute:rgba(255,255,255,.86);--card:rgba(255,255,255,.22)}
#app[data-hc="1"] #full,#app[data-hc="1"] #lyr{--mute:rgba(255,255,255,.96)}

  <div class="row" style="margin-top:24px"><h2>Text contrast</h2></div><div class="seg"><button data-hcb="0" class="${S.hc?"":"on"}">Standard</button><button data-hcb="1" class="${S.hc?"on":""}">High</button></div>

  <p class="empty" style="margin-top:18px">Playlists, liked songs and sound settings are saved on this device.</p>`;
function detail(){const c=S.nav.indexOf(":"),k=S.nav.slice(0,c),id=S.nav.slice(c+1);let ti,sub,idx,bg,pl=null;S.plv=null;
  if(k==="recent"){idx=recentIdx();ti="Recently played";sub=idx.length+" song"+(idx.length===1?"":"s");bg=idx.length?collage(idx):"var(--card)"}
  else if(k==="album"){const o=albums().find(x=>x.id===id);if(!o){S.nav=null;return home()}ti=o.name;sub=o.artist+(o.y?" · "+o.y:"")+" · "+o.idx.length+" songs";idx=o.idx;bg=artOf(T[rep(idx)])}
  else if(k==="artist"){const o=artists().find(x=>x.id===id);if(!o){S.nav=null;return home()}ti=o.name;sub=o.idx.length+" songs";idx=o.idx;bg=artOf(T[rep(idx)])}
  else if(id==="liked"){ti="Liked songs";idx=likedIdx();sub=idx.length+" songs";bg=art("201,151,90")}
  else{pl=S.pls.find(p=>p.id===id);if(!pl){S.nav=null;return home()}S.plv=pl.id;ti=pl.name;idx=plIdx(pl);const miss=pl.keys.length-idx.length;sub=idx.length+" songs"+(miss?` · ${miss} not loaded on this device`:"");bg=plArt(id,idx)}
  return `<button class="bk" data-back>‹ Back</button><div class="dh"><i class="dc" style="background:${bg}"></i><div style="min-width:0"><h1>${esc(ti)}</h1><p>${esc(sub)}</p></div></div>
  <div class="acts"><button class="addb" data-pa>Play</button><button class="ghost" data-ps>Shuffle</button><button class="ghost" data-pn>Play next</button><button class="ghost" data-pq>Add to queue</button>${k==="recent"&&idx.length?'<button class="ghost" data-clrh>Clear history</button>':""}${pl?`<button class="ghost" data-rn="${pl.id}">Rename</button><button class="ghost" data-dl="${pl.id}">Delete</button>`:""}</div>
  ${idx.length?list(idx,"d"):`<p class="empty">${k==="recent"?"Nothing played yet. Songs you listen to will show up here.":"No songs here yet. Use the ⋯ menu on any song to add it."}</p>`}`}
function render(){S.lists={};const v=$("view");
  v.innerHTML=S.nav?detail():S.tab==="Home"?home():S.tab==="Search"?searchV():S.tab==="Discover"?discoverV():S.tab==="Library"?libV():profV();
  if(!S.nav&&S.tab==="Discover")S.dm==="radio"?radioBind():musicBind();
  if(!S.nav&&S.tab==="Search"){const q=$("q");q.oninput=()=>{S.sq=q.value;$("res").innerHTML=resHtml();bind();sync()}}
  bind();sync()}
function bind(){
  document.querySelectorAll("[data-pick]").forEach(i=>i.onchange=e=>{const f=[...e.target.files];e.target.value="";addFiles(f)});
  document.querySelectorAll("[data-i]").forEach(e=>e.onclick=ev=>{if(ev.target.closest("[data-m]"))return;play(+e.dataset.i,S.lists[e.dataset.l])});
  document.querySelectorAll("[data-m]").forEach(e=>e.onclick=ev=>{ev.stopPropagation();trackMenu(+e.dataset.m)});
  document.querySelectorAll("[data-go]").forEach(e=>e.onclick=()=>{if(e.dataset.lib)S.lib=e.dataset.lib;go(e.dataset.go)});
  document.querySelectorAll("[data-lib]:not([data-go])").forEach(e=>e.onclick=()=>{S.lib=e.dataset.lib;render()});
  document.querySelectorAll("[data-cm]").forEach(e=>e.onclick=ev=>{ev.stopPropagation();collMenu(e.dataset.cm)});
  document.querySelectorAll("[data-pn]").forEach(e=>e.onclick=()=>qAddList(S.lists.d,true));
  document.querySelectorAll("[data-pq]").forEach(e=>e.onclick=()=>qAddList(S.lists.d,false));
  document.querySelectorAll("[data-nav]").forEach(e=>e.onclick=()=>{S.nav=decodeURIComponent(e.dataset.nav);render();$("view").scrollTop=0});
  document.querySelectorAll("[data-np]").forEach(e=>e.onclick=()=>newPlM(null));
  document.querySelectorAll("[data-back]").forEach(e=>e.onclick=()=>{S.nav=null;render()});
  document.querySelectorAll("[data-pa]").forEach(e=>e.onclick=()=>playList(S.lists.d||[],false));
  document.querySelectorAll("[data-ps]").forEach(e=>e.onclick=()=>playList(S.lists.d||[],true));
  document.querySelectorAll("[data-rn]").forEach(e=>e.onclick=()=>{const p=S.pls.find(x=>x.id===e.dataset.rn);modal(`<h3>Rename playlist</h3><input id="mi" value="${esc(p.name)}" maxlength="40"><button class="addb" data-a="rn:${p.id}">Save</button>`,1)});
  document.querySelectorAll("[data-dl]").forEach(e=>e.onclick=()=>modal(`<h3>Delete playlist?</h3><p>The songs stay in your library.</p><button class="addb" data-a="dl:${e.dataset.dl}">Delete</button> <button class="ghost" data-x>Cancel</button>`));
  document.querySelectorAll("[data-dm]").forEach(e=>e.onclick=()=>{S.dm=e.dataset.dm;render()});
  document.querySelectorAll("[data-inst]").forEach(e=>e.onclick=()=>{if(ipEvt){ipEvt.prompt();if(ipEvt.userChoice)ipEvt.userChoice.then(()=>{ipEvt=null;render()})}});
  document.querySelectorAll("[data-clr]").forEach(e=>e.onclick=()=>{const n=libStats().n;modal(`<h3>Remove all uploaded songs?</h3><p>This deletes ${n} song${n===1?"":"s"} from this device's storage. Playlists keep their entries and light up again if you add the songs back.</p><button class="addb" data-a="clr:">Remove all</button> <button class="ghost" data-x>Cancel</button>`)});
  document.querySelectorAll("[data-acct]").forEach(e=>e.onclick=()=>go("Profile"));
  document.querySelectorAll("[data-edit]").forEach(e=>e.onclick=openEdit);
  document.querySelectorAll("[data-su]").forEach(e=>e.onclick=signUpM);
  document.querySelectorAll("[data-si]").forEach(e=>e.onclick=signInM);
  document.querySelectorAll("[data-so]").forEach(e=>e.onclick=()=>{S.acct=null;LS.set("milo.cur","");toast("Signed out");afterSwitch()});
  document.querySelectorAll("[data-del]").forEach(e=>e.onclick=()=>modal(`<h3>Delete account?</h3><p>This removes "${esc(S.acct.name)}" and its playlists and likes from this device. Your guest data isn't affected.</p><button class="addb" data-a="delc:">Delete</button> <button class="ghost" data-x>Cancel</button>`));
  document.querySelectorAll("[data-clrh]").forEach(e=>e.onclick=()=>{S.hist=[];save();render();toast("History cleared")});
  document.querySelectorAll("[data-cloud]").forEach(e=>e.onclick=()=>{const k=e.dataset.cloud;if(k==="up"||k==="in")cloudM(k);else if(k==="out")cloudOut();else if(k==="pull")sbPull(true);else if(k==="sql")sqlM()});
  document.querySelectorAll("[data-mix]").forEach(e=>e.onclick=()=>{const m=(S.mixes||[]).find(x=>x.id===e.dataset.mix);if(m){playList(m.idx,true);toast("Playing "+m.name)}});
  document.querySelectorAll("[data-hub]").forEach(e=>e.onclick=()=>{const k=e.dataset.hub;
    if(k==="music"||k==="radio"){S.dm=k;go("Discover")}
    else if(k==="yt"){S.dm="music";S.ms="yt";S.mg="Trending";S.mres=[];S.mErr="";S.mqv="";S.mtried=0;go("Discover")}
    else if(k==="cloud")go("Profile");
    else if(k==="library")go("Library");
    else if(k==="lyrics"){if(S.cur>=0)openLyrics();else toast("Play a song to see its lyrics")}
    else soundM()});
  document.querySelectorAll("[data-hcb]").forEach(e=>e.onclick=()=>{S.hc=e.dataset.hcb==="1";save();applyWash();render()});
  document.querySelectorAll("[data-pst]").forEach(e=>e.onclick=()=>{S.ps=e.dataset.pst;save();setStyle();render()});
  document.querySelectorAll("[data-snd]").forEach(e=>e.onclick=soundM);
  document.querySelectorAll("[data-demo]").forEach(e=>e.onclick=()=>{const v=e.dataset.demo;if(v==="all")T.forEach(t=>{if(t.demo)t.hid=false});else T[+v].hid=!T[+v].hid;S.demoOn=T.filter(t=>t.demo&&!t.hid).map(t=>t.key);save();toast(v==="all"?"Demo songs added to your library":T[+v].hid?"Moved back to the demo folder":"Added to your library");render()});
  document.querySelectorAll("[data-th]").forEach(e=>e.onclick=()=>{S.th=e.dataset.th;save();theme();render()})}
function theme(){const d=S.th==="dark"||(S.th==="auto"&&(S.lux!=null?S.lux<40:matchMedia("(prefers-color-scheme: dark)").matches));$("app").dataset.theme=d?"dark":"light";applyWash()}
function go(t){S.tab=t;S.nav=null;nav();render();$("view").scrollTop=0}
function nav(){$("nav").innerHTML=Object.keys(ICON).map(k=>`<button class="${S.tab===k?"on":""}" data-t="${k}"><svg viewBox="0 0 24 24">${ICON[k]}</svg>${k}</button>`).join("");
  document.querySelectorAll("[data-t]").forEach(e=>e.onclick=()=>go(e.dataset.t))}

/* ---------- modals: menus, playlists, queue, speed, sleep ---------- */
function modal(h,focus){S.qopen=false;const m=$("mdl");m.innerHTML=`<div class="scr" data-x></div><div class="pan">${h}</div>`;m.hidden=false;requestAnimationFrame(()=>{m.classList.add("open");if(focus){const i=$("mi");if(i){i.focus();i.select()}}})}
function closeM(){S.qopen=false;const m=$("mdl");m.classList.remove("open");setTimeout(()=>{if(!m.classList.contains("open"))m.hidden=true},260)}
function trackMenu(i){const t=T[i],lk=S.likes.has(t.key);
  const head=`<div class="mh"><i class="art" style="background:${artOf(t)}"></i><div><b>${esc(t.t)}</b><br><small>${esc(t.a)}</small></div></div>`;
  if(t.radio){modal(head+`<button class="mi" data-a="lk:${i}">${lk?"Remove saved station":"Save station"}</button>`);return}
  if(t.ph){modal(head+`<button class="mi" data-a="op:${i}">Open on the Internet Archive</button>`);return}
  modal(head+`<button class="mi" data-a="pn:${i}">Play next</button><button class="mi" data-a="aq:${i}">Add to queue</button><button class="mi" data-a="ap:${i}">Add to playlist</button>
  <button class="mi" data-a="lk:${i}">${lk?"Remove from Liked songs":"Add to Liked songs"}</button><button class="mi" data-a="shr:${i}">Share</button>${t.al&&!t.stream?`<button class="mi" data-a="ga:${i}">Go to album</button>`:""}${t.stream?"":`<button class="mi" data-a="gr:${i}">Go to artist</button>`}
  ${t.url&&!t.stream?`<button class="mi" data-a="fi:${i}">Find art &amp; info (iTunes)</button>`:""}${t.url?`<button class="mi" data-a="fl:${i}">Find lyrics online</button>`:""}${t.page?`<button class="mi" data-a="op:${i}">Open original page</button>`:""}${t.file?`<button class="mi" data-a="rmv:${i}">Remove from library</button>`:""}<button class="mi" data-a="el:${i}">Listen on other services</button>
  ${S.nav&&S.nav.startsWith("pl:")&&S.plv?`<button class="mi" data-a="rm:${i}">Remove from this playlist</button>`:""}`)}
function addPlM(i){modal(`<h3>Add to playlist</h3>${S.pls.map(p=>`<button class="mi" data-a="tp:${i}:${p.id}">${esc(p.name)}${p.keys.includes(T[i].key)?" ✓":""}</button>`).join("")}<button class="mi" data-a="np:${i}">+ New playlist</button>`)}
function newPlM(i){modal(`<h3>New playlist</h3><input id="mi" placeholder="Playlist name" maxlength="40" data-t="${i??""}"><button class="addb" data-a="mk:">Create</button>`,1)}
function mkPl(n,i){const p={id:"p"+Date.now().toString(36),name:n.trim()||"Untitled playlist",keys:[]};if(i!=null){p.keys.push(T[i].key);rememberStream(i)}S.pls.push(p);save();return p}
const queueHtml=()=>`<h3>Queue</h3>${S.q.map((i,k)=>`<div class="li${k===S.qi?" on":""}" data-a="qj:${k}" role="button"><i style="background:${artOf(T[i])}"><u class="eq"><s></s><s></s><s></s></u></i><span><b>${esc(T[i].t)}</b><small>${esc(T[i].a)}</small></span><em>${k===S.qi?"Playing":""}</em></div>`).join("")}`;
function openQueue(){if(!S.q.length){toast("Nothing in the queue yet");return}modal(queueHtml());S.qopen=true}
function qRefresh(){const p=$("mdl").querySelector(".pan");if(!p||$("mdl").hidden||!S.qopen)return;const y=p.scrollTop;p.innerHTML=queueHtml();p.scrollTop=y}
const openSpeed=()=>modal(`<h3>Playback speed</h3>${[.75,1,1.25,1.5,2].map(r=>`<button class="mi" data-a="sp:${r}">${r}×${r===S.rate?" ✓":""}</button>`).join("")}`);
const openSleep=()=>modal(`<h3>Sleep timer</h3>${[["Off","0"],["15 minutes","15"],["30 minutes","30"],["60 minutes","60"],["End of song","end"]].map(([n,v])=>`<button class="mi" data-a="sl:${v}">${n}</button>`).join("")}`);
function goNav(v){$("full").classList.remove("open");$("lyr").classList.remove("open");S.nav=v;S.tab="Library";nav();render();$("view").scrollTop=0}
const BANDS=["32","64","125","250","500","1k","2k","4k","8k","16k"];
function soundM(){updCtl();const e=S.eq;
  modal(`<h3>Sound</h3><div class="row" style="margin:0 0 10px"><b style="font-weight:500">Equalizer</b><button class="dm" data-a="eqt:">${S.eqOn?"On":"Off"}</button></div>
  <div class="seg pr">${Object.keys(PRESETS).map(n=>`<button data-a="eq:${n}" class="${e.n===n?"on":""}">${n}</button>`).join("")}</div>
  <div class="bands">${BANDS.map((b,k)=>`<div class="bandw"><input type="range" min="-12" max="12" step=".5" value="${e.g[k]}" data-b="${k}" aria-label="${b} Hz"><small>${b}</small></div>`).join("")}</div>
  <p>${S.cur>=0&&(T[S.cur].radio||T[S.cur].stream)?"Streams and radio get the EQ only when their server allows it, and crossfade never applies to them.":"EQ applies to your songs and the demo songs. Dolby and IMAX here are sound profiles that widen and fatten the mix, not licensed Dolby or IMAX processing."}</p>
  <div class="row" style="margin:6px 0 10px"><b style="font-weight:500">Crossfade</b></div>
  <div class="seg">${[[0,"Off"],[3,"3s"],[6,"6s"],[9,"9s"],[12,"12s"]].map(([v,n])=>`<button data-a="xf:${v}" class="${S.xf===v?"on":""}">${n}</button>`).join("")}</div>
  <div class="row" style="margin:20px 0 10px"><b style="font-weight:500">Gapless playback</b><button class="dm" data-a="gp:">${S.gap?"On":"Off"}</button></div>
  <div class="row" style="margin:12px 0 6px"><b style="font-weight:500">Autoplay similar songs</b><button class="dm" data-a="auto:">${S.auto?"On":"Off"}</button></div>
  <div class="row" style="margin:20px 0 6px"><b style="font-weight:500">Header motes</b><button class="dm" data-a="viz:">${S.viz?"On":"Off"}</button></div>
  <p>Soft light motes that rise from the curved edge of the header and gather where the music is loudest. For your own songs they follow the real audio; for streams and radio, which the browser keeps out of the audio analyser, they move with the room microphone if it is on, otherwise they dance to a generated rhythm.</p>
  <div class="row" style="margin:20px 0 10px"><b style="font-weight:500">Ambient light</b></div>
  <div class="seg">${[[0,"Off"],[1,"Soft"],[2,"Vivid"]].map(([v,n])=>`<button data-a="amb:${v}" class="${S.amb===v?"on":""}">${n}</button>`).join("")}</div>
  <p style="margin-top:10px">A glow around the cover in the song's colours. For your own songs it also pulses with the bass.</p>
  <div class="row" style="margin:20px 0 6px"><b style="font-weight:500">Room sound (microphone)</b><button class="dm" data-a="mic:">${S.mic?"On":"Off"}</button></div>
  <p>Makes the glow react to sound in the room, so it works with radio, streams and music playing elsewhere. Audio is analysed on your device and never recorded or sent.</p>
  <div class="row" style="margin:6px 0 6px"><b style="font-weight:500">Room light sensor</b><button class="dm" data-a="lux:">${S.luxs?"On":"Off"}</button></div>
  <p>${"AmbientLightSensor" in window?"Softens or brightens the glow with the light in the room, and switches the Auto background to dark in dim rooms.":"This browser doesn't give pages access to a light sensor, so this has no effect here."}</p>`)}
function act(k,x){
  if(k==="cpl"){closeM();playList(S.cidx||[],false)}
  else if(k==="csh"){closeM();playList(S.cidx||[],true)}
  else if(k==="cpn"){closeM();qAddList(S.cidx,true)}
  else if(k==="cqu"){closeM();qAddList(S.cidx,false)}
  else if(k==="cap")addListPlM();
  else if(k==="tpl"){const p=S.pls.find(q=>q.id===x);if(p){addKeys(p,S.cidx||[]);toast("Added to "+p.name)}closeM();render()}
  else if(k==="npl"){S.pendList=(S.cidx||[]).slice();newPlM(null)}
  else if(k==="cop"){closeM();S.nav=decodeURIComponent(x);render();$("view").scrollTop=0}
  else if(k==="rmv"){closeM();removeSong(+x)}
  else if(k==="clr"){closeM();clearLibrary()}
  else if(k==="op"){try{window.open(T[+x].page,"_blank","noopener")}catch(e){}closeM()}
  else if(k==="el")elseM(+x);
  else if(k==="su")doSignUp();
  else if(k==="si")doSignIn();
  else if(k==="gsu")signUpM();
  else if(k==="gsi")signInM();
  else if(k==="avc"){const a=S.ed.av;S.ed.name=$("mi").value;S.ed.av=a.t==="emoji"?{...a,c:x}:{t:"color",c:x};editM()}
  else if(k==="ave"){S.ed.name=$("mi").value;S.ed.av={t:"emoji",e:x,c:S.ed.av.c||AVC[0]};editM()}
  else if(k==="avi"){S.ed.name=$("mi").value;S.ed.av={t:"color",c:S.ed.av.c||AVC[0]};editM()}
  else if(k==="edsave")edSave();
  else if(k==="delc"){const id=S.acct.id;S.accts=S.accts.filter(a=>a.id!==id);LS.set("milo.accts",S.accts);try{localStorage.removeItem("milo.v2."+id)}catch(e){}S.acct=null;LS.set("milo.cur","");closeM();toast("Account deleted");afterSwitch()}
  else if(k==="eq"){S.eq={n:x,...JSON.parse(JSON.stringify(PRESETS[x]))};S.eqOn=true;applyEQ();save();soundM()}
  else if(k==="eqt"){S.eqOn=!S.eqOn;applyEQ();save();soundM()}
  else if(k==="ps"){S.ps=x;save();setStyle();soundM()}
  else if(k==="mic")micToggle();
  else if(k==="lux")luxToggle();
  else if(k==="clauth")doCloudAuth(x)
  else if(k==="clsql")sqlCopy()
  else if(k==="auto"){S.auto=!S.auto;save();soundM()}
  else if(k==="shr"){closeM();shareTrack(+x)}
  else if(k==="idle"){S.idle=!S.idle;save();soundM()}
  else if(k==="viz"){S.viz=!S.viz;save();vzKick();soundM()}
  else if(k==="amb"){S.amb=+x;save();ambApply();ambKick();soundM()}
  else if(k==="xf"){S.xf=+x;save();soundM()}
  else if(k==="gp"){S.gap=!S.gap;save();soundM()}
  else if(k==="fi"){closeM();findInfo(+x)}
  else if(k==="fl"){closeM();findLyrics(+x,true)}
  else if(k==="pn"){qIns(+x,true);toast("Playing next");closeM()}
  else if(k==="aq"){qIns(+x,false);toast("Added to queue");closeM()}
  else if(k==="ap")addPlM(+x);
  else if(k==="tp"){const [ii,id]=x.split(":"),p=S.pls.find(q=>q.id===id);if(p&&!p.keys.includes(T[+ii].key)){p.keys.push(T[+ii].key);rememberStream(+ii);save()}toast("Added to "+(p?p.name:"playlist"));closeM();render()}
  else if(k==="np")newPlM(+x);
  else if(k==="mk"){const inp=$("mi"),t=inp.dataset.t,p=mkPl(inp.value,t===""?null:+t),pend=S.pendList;S.pendList=null;if(pend)addKeys(p,pend);closeM();toast(`Created "${p.name}"`);render()}
  else if(k==="rn"){const p=S.pls.find(q=>q.id===x);if(p){p.name=$("mi").value.trim()||p.name;save()}closeM();render()}
  else if(k==="dl"){S.pls=S.pls.filter(p=>p.id!==x);S.nav=null;save();closeM();render()}
  else if(k==="lk"){toggleLike(+x);closeM()}
  else if(k==="ga"){closeM();goNav("album:"+T[+x].al.toLowerCase())}

    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error("blocked"))}catch(e){rej(e)}});
  dbP.catch(()=>{dbP=null});return dbP}

/* ---------- everything that shows "now playing" updates the moment the song changes ---------- */
const recentIdx=()=>S.hist.map(idxOfKey).filter(i=>i>=0&&showable(i));
const recentHtml=rc=>rc.length?`<div class="recent r${rc.length}">${rc.map(tile).join("")}</div>`:'<p class="empty" style="margin-bottom:22px">Songs you play will show up here.</p>';
function pushHist(i){const t=T[i];if(!t||!t.key||t.ph)return;S.hist=[t.key,...S.hist.filter(x=>x!==t.key)].slice(0,80);save();updRecent()}
function updRecent(){
  if(S.nav==="recent:all"){const v=$("view"),y=v.scrollTop;render();v.scrollTop=y;return}
  if(S.tab==="Home"&&!S.nav){const c=$("recentBox");if(c){const rc=recentIdx().slice(0,3);S.lists.home=rc.slice();c.innerHTML=recentHtml(rc);bind();sync()}}}
function markNow(){const t=T[S.cur],refs=new Set();
  if(t){if(t.al&&!t.radio)refs.add("album:"+encodeURIComponent(t.al.toLowerCase()));
    new Set([...(t.a||"").split(/,\s*/),t.aa].filter(Boolean)).forEach(n=>refs.add("artist:"+encodeURIComponent(n.toLowerCase())));
    S.pls.forEach(p=>{if(p.keys.includes(t.key))refs.add("pl:"+encodeURIComponent(p.id))});if(S.likes.has(t.key))refs.add("pl:liked")}

function imSize(){const c=IM.cv=IM.cv||$("imv");if(!c)return;const r=c.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);IM.w=Math.max(1,r.width);IM.h=Math.max(1,r.height);c.width=Math.round(IM.w*d);c.height=Math.round(IM.h*d);IM.cx=c.getContext("2d");if(IM.cx)IM.cx.setTransform(d,0,0,d,0,0)}

function imDraw(t){const x=IM.cx;if(!x)return;const n=VZ.n,w=IM.w,h=IM.h,mid=(n-1)/2,step=w/n,rgb=t?acc(t.c):"201,151,90";let low=0;for(let i=0;i<8;i++)low+=VZ.v[i];low/=8;

/* ---------- insights, autoplay, share, backup, shortcuts ---------- */
const dayKey=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function statTick(){S.stat=S.stat||{};const k=dayKey();S.stat[k]=(S.stat[k]||0)+.25}
const durTxt=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+"h "+m+"m":m?m+" min":s+" s"};
function insightsM(){const st=S.stat||{},pl=S.plays||{};
  const tot=Object.values(st).reduce((a,b)=>a+b,0),days=[];
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push([d.toLocaleDateString(undefined,{weekday:"short"}).slice(0,1),st[dayKey(d)]||0])}
  const mx=Math.max(60,...days.map(x=>x[1]));let streak=0;
  for(let i=0;i<400;i++){const d=new Date();d.setDate(d.getDate()-i);if((st[dayKey(d)]||0)>=30)streak++;else if(i>0)break}
  const rows=[],ar={},gn={};let np=0;
  Object.keys(pl).forEach(k=>{const i=idxOfKey(k);if(i<0)return;const t=T[i],n=pl[k];np+=n;rows.push([i,n]);if(t.a)ar[t.a]=(ar[t.a]||0)+n;if(t.g)gn[t.g]=(gn[t.g]||0)+n});
  rows.sort((a,b)=>b[1]-a[1]);const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const list=(a,fn)=>a.map((x,j)=>`<div class="insr"><em>${j+1}</em>${fn(x)}</div>`).join("");
  modal(`<h3>Your insights</h3><div class="ins"><div><b>${durTxt(tot)}</b><small>listened</small></div><div><b>${np}</b><small>plays</small></div><div><b>${streak}</b><small>day streak</small></div></div>
  <div class="inb">${days.map(([l,v])=>`<div class="c" title="${durTxt(v)}"><span class="u" style="--h:${Math.round(v/mx*100)*.7}px"></span><small>${l}</small></div>`).join("")}</div>
  ${rows.length?`<h4>Top songs</h4>${list(rows.slice(0,5),([i,n])=>`<i style="background:${artOf(T[i])}"></i><span>${esc(T[i].t)}<small>${esc(T[i].a||"")}</small></span><small>${n} play${n>1?"s":""}</small>`)}
  <h4>Top artists</h4>${list(top(ar),([a,n])=>`<span>${esc(a)}</span><small>${n} plays</small>`)}
  ${Object.keys(gn).length?`<h4>Top genres</h4>${list(top(gn),([a,n])=>`<span>${esc(a)}</span><small>${n} plays</small>`)}`:""}`:`<p>Listen to a song for 30 seconds and your top songs, artists and genres show up here.</p>`}`)}
function autoPick(){const c=T[S.cur];if(!c)return false;const seen=new Set(S.hist.slice(0,25).map(k=>k)),pool=[];
  T.forEach((t,i)=>{if(i===S.cur||t.radio||t.ph||t.yt||t.gone||!t.url&&!t.n||!showable(i)||seen.has(t.key))return;
    let s=Math.random()*1.5;if(c.a&&t.a===c.a)s+=3;if(c.g&&t.g===c.g)s+=2;if(S.likes.has(t.key))s+=1;pool.push([s,i])});
  if(!pool.length)return false;pool.sort((a,b)=>b[0]-a[0]);const i=pool[0][1];S.q.push(i);S.qi=S.q.length-1;start(i,true);toast("Autoplay: more like "+(c.a||c.t));return true}
function shareTrack(i){const t=T[i],txt=t.t+(t.a?" — "+t.a:"")+" · on milo.",url=t.page||(/^https?:/.test(t.url||"")?t.url:"");
  if(navigator.share){navigator.share({title:t.t,text:txt,url:url||undefined}).catch(()=>{});return}
  const s=url?txt+"\n"+url:txt;try{navigator.clipboard.writeText(s).then(()=>toast("Copied to clipboard"),()=>toast(s))}catch(e){toast(s)}}
function backupOut(){try{const o=LS.get(dkey(),{}),b=new Blob([JSON.stringify({milo:2,at:Date.now(),data:o},null,1)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="milo-backup-"+dayKey()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast("Backup saved. Songs you uploaded are not included.")}catch(e){toast("Couldn't create the backup")}}
function backupIn(f){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||j.milo!==2||!j.data)throw 0;LS.set(dkey(),j.data);loadData();save();render();toast("Backup restored")}catch(e){toast("That isn't a milo. backup file")}};r.readAsText(f)}
function keysM(){const R=[["Space","Play / pause"],["← →","Seek 5 s"],["Shift + ← →","Previous / next"],["N / P","Next / previous"],["S","Shuffle"],["R","Repeat"],["L","Lyrics"],["F","Full-screen now playing"],["M","Mute"],["+ / −","Volume"],["/","Search"],["?","This list"],["TV remote","Arrows move, OK selects, Back goes back"]];
  modal(`<h3>Keyboard shortcuts</h3><div class="kbd">${R.map(([k,v])=>`<kbd>${k}</kbd><span>${v}</span>`).join("")}</div>`)}
$("view").addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("[data-tool]");if(!b)return;const k=b.dataset.tool;if(k==="ins")insightsM();else if(k==="bkx")backupOut();else if(k==="keys")keysM()});

/* ---------- station art: find the best logo, tint the app from it ---------- */
var SA={q:[],n:0,rt:0};
const hostOf=u=>{try{return new URL(/^https?:/.test(u)?u:"http://"+u).hostname.replace(/^www\./,"")}catch(e){return""}};
function loadImg(u,min){return new Promise(res=>{const go=cors=>{const im=new Image();let d=0;const f=ok=>{if(d)return;d=1;if(ok&&im.naturalWidth>=min&&im.naturalHeight>=min)res({im,cors,w:im.naturalWidth});else if(cors)go(false);else res(null)};im.onload=()=>f(1);im.onerror=()=>f(0);setTimeout(()=>f(0),7000);if(cors)im.crossOrigin="anonymous";im.referrerPolicy="no-referrer";im.src=u};go(true)})}
function artCands(t){const h=hostOf(t.home),o=[];if(t.logo)o.push([t.logo,24]);
  if(h)o.push([`https://t3.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=${encodeURIComponent("https://"+h)}&size=256`,64],[`https://icons.duckduckgo.com/ip3/${h}.ico`,32],[`https://${h}/apple-touch-icon.png`,96],[`https://${h}/favicon.ico`,32]);
  return o}
function logoColor(im){try{const c=document.createElement("canvas");c.width=c.height=32;const x=c.getContext("2d");x.drawImage(im,0,0,32,32);const d=x.getImageData(0,0,32,32).data;let r=0,g=0,b=0,w=0;
  for(let i=0;i<d.length;i+=4){if(d[i+3]<60)continue;const mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]);if(mn>238||mx<22)continue;const s=(mx-mn)/(mx||1),k=.05+s*s*s;r+=d[i]*k;g+=d[i+1]*k;b+=d[i+2]*k;w+=k}
  return w>0?[r,g,b].map(v=>Math.round(v/w)).join(","):null}catch(e){return null}}
async function stationArt(t){if(!t||!t.radio||t.artDone)return;t.artDone=1;
  const rs=await Promise.all(artCands(t).map(([u,m])=>loadImg(u,m).then(r=>r&&{...r,u})));
  const ok=rs.filter(Boolean);if(!ok.length)return;ok.sort((a,b)=>b.w-a.w);const best=ok[0];
  t.logo=best.u;t.lgw=best.w;t.lg=1;let col=null;for(const x of [best,...ok]){if(x.cors){col=logoColor(x.im);if(col)break}}
  if(col)t.c=col;
  const f=S.rfav.find(x=>x.id===t.sid);if(f){f.logo=t.logo;f.home=t.home;f.lg=1;if(col)f.c=col;save()}
  if(T[S.cur]===t){bgArt(t);glowSet(t);sync();if(IM.on)imRender()}
  else{clearTimeout(SA.rt);SA.rt=setTimeout(()=>{refreshR()},700)}}
function artScan(){T.forEach(t=>{if(t.radio&&t.needArt&&!t.artDone&&!t.lg&&!SA.q.includes(t))SA.q.push(t)});artPump()}
function artPump(){while(SA.n<3&&SA.q.length){const t=SA.q.shift();SA.n++;stationArt(t).catch(()=>{}).finally(()=>{SA.n--;artPump()})}}
artScan();

/* ---------- smart TV: 10-foot layout, remote-control keys, D-pad focus ---------- */
var TVUA=/Tizen|Web0S|WebOS|SMART-TV|SmartTV|Android TV|AFTM|AFTT|AFTS|AFTB|BRAVIA|VIDAA|HbbTV|CrKey|GoogleTV|PhilipsTV|NetCast|Large Screen/i;
function tvOn(){const q=location.search.match(/[?&]tv=(\d)/);if(q)LS.set("milo.tv",q[1]==="1");const m=LS.get("milo.tv",null);return m!==null?!!m:TVUA.test(navigator.userAgent)}
function tvApply(){const on=tvOn(),a=$("app");a.toggleAttribute("data-tv",on);a.style.setProperty("--tvz",Math.max(1,Math.min(2,innerWidth/1280)).toFixed(2));S.tv=on;
  if(on){tvMark();try{if(window.tizen&&tizen.tvinputdevice)["MediaPlayPause","MediaPlay","MediaPause","MediaStop","MediaFastForward","MediaRewind","MediaTrackNext","MediaTrackPrevious","ColorF0Red","ColorF1Green"].forEach(k=>{try{tizen.tvinputdevice.registerKey(k)}catch(e){}})}catch(e){}}}
const TVSEL='button:not([disabled]),a[href],input:not([type=file]):not([type=hidden]),[tabindex="0"],label.addb';
function tvMark(){document.querySelectorAll("#view [data-i],#view [data-go],#view [data-mix],#view [data-hub],#view [data-nav],#view [data-lib],#view [data-np],#view [data-m],#view [data-acct],#view [data-si],#view [data-so],#view [data-back],.tile,.dc,.dc2").forEach(e=>{if(!e.hasAttribute("tabindex"))e.tabIndex=0})}
function tvRoot(){return !$("mdl").hidden?$("mdl"):$("lyr").classList.contains("open")?$("lyr"):IM.on?$("im"):$("full").classList.contains("open")?$("full"):$("app")}
function tvList(){const root=tvRoot();return [...root.querySelectorAll(TVSEL)].filter(e=>{if(e.closest("[hidden]"))return false;if(root===$("app")&&(e.closest("#full")||e.closest("#lyr")||e.closest("#im")||e.closest("#mdl")))return false;const r=e.getBoundingClientRect();if(r.width<4||r.height<4)return false;const cs=getComputedStyle(e);return cs.visibility!=="hidden"&&cs.display!=="none"&&r.bottom>0&&r.top<innerHeight&&r.right>0&&r.left<innerWidth})}
function tvMove(k){const els=tvList(),cur=document.activeElement;if(!cur||!els.includes(cur)){if(els[0])els[0].focus({preventScroll:true});return}
  const c=cur.getBoundingClientRect(),cx=c.left+c.width/2,cy=c.top+c.height/2;let best=null,bs=1e9;
  els.forEach(e=>{if(e===cur)return;const r=e.getBoundingClientRect(),dx=r.left+r.width/2-cx,dy=r.top+r.height/2-cy;let ok,p,o;
    if(k==="ArrowRight"){ok=dx>4&&Math.abs(dy)<=Math.abs(dx)*1.6+c.height;p=dx;o=Math.abs(dy)}
    else if(k==="ArrowLeft"){ok=dx<-4&&Math.abs(dy)<=Math.abs(dx)*1.6+c.height;p=-dx;o=Math.abs(dy)}
    else if(k==="ArrowDown"){ok=dy>4&&Math.abs(dx)<=Math.abs(dy)*1.6+c.width;p=dy;o=Math.abs(dx)}
    else{ok=dy<-4&&Math.abs(dx)<=Math.abs(dy)*1.6+c.width;p=-dy;o=Math.abs(dx)}
    if(ok){const s=p+o*2;if(s<bs){bs=s;best=e}}});
  if(best){best.focus({preventScroll:true});try{best.scrollIntoView({block:"nearest",inline:"nearest",behavior:"smooth"})}catch(e){}}}
function tvBack(){if(!$("mdl").hidden)closeM();else if($("lyr").classList.contains("open"))$("lyr").classList.remove("open");else if(IM.on)imClose();else if($("full").classList.contains("open"))$("full").classList.remove("open");else if(S.nav){S.nav=null;render()}}
addEventListener("keydown",e=>{if(!S.tv)return;const k=e.key,c=e.keyCode,tag=e.target&&e.target.tagName;
  if(c===10009||c===461||k==="BrowserBack"||k==="GoBack"||(k==="Backspace"&&tag!=="INPUT"&&tag!=="TEXTAREA")){e.preventDefault();e.stopImmediatePropagation();tvBack();return}
  if(k==="MediaPlayPause"||c===10252||c===415||c===19||k==="MediaPlay"||k==="MediaPause"){e.preventDefault();e.stopImmediatePropagation();if(S.cur>=0)toggle();return}
  if(k==="MediaTrackNext"||c===10233){e.preventDefault();next(false);return}
  if(k==="MediaTrackPrevious"||c===10232){e.preventDefault();prev();return}
  if(k==="MediaFastForward"||c===417){e.preventDefault();if(S.cur>=0&&!T[S.cur].radio)seekTo(Math.min(T[S.cur].d||1e9,S.pos+15));return}
  if(k==="MediaRewind"||c===412){e.preventDefault();if(S.cur>=0&&!T[S.cur].radio)seekTo(Math.max(0,S.pos-15));return}
  if(k==="MediaStop"||c===413){e.preventDefault();if(S.playing)toggle();return}
  if(e.target&&e.target.type==="range"&&(k==="ArrowLeft"||k==="ArrowRight"))return;
  if(tag==="INPUT"&&e.target.type!=="range"&&e.target.type!=="checkbox"&&(k==="ArrowLeft"||k==="ArrowRight"))return;
  if(k==="ArrowUp"||k==="ArrowDown"||k==="ArrowLeft"||k==="ArrowRight"){e.preventDefault();e.stopImmediatePropagation();if(IM.on||$("full").classList.contains("open")&&!document.activeElement.closest(".ctl,.fh,.ft,.sub"))return tvMove(k);tvMove(k);return}
  if(k==="Enter"){const a=document.activeElement;if(a&&a!==document.body&&!/^(BUTTON|A|INPUT|TEXTAREA|SELECT|LABEL)$/.test(a.tagName)){e.preventDefault();a.click()}}},true);
new MutationObserver(()=>{if(S.tv){clearTimeout(S.tvm);S.tvm=setTimeout(tvMark,80)}}).observe($("view"),{childList:true,subtree:true});
addEventListener("resize",()=>{if(S.tv)tvApply()});
$("view").addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("[data-tool=tv]");if(!b)return;LS.set("milo.tv",!tvOn());tvApply();render();toast(tvOn()?"TV mode on. Use the arrow keys and OK on your remote.":"TV mode off")});
tvApply();
